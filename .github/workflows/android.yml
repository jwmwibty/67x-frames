name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install GLSL compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Compile Vulkan shaders
        run: |
          mkdir -p app/src/main/assets/shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o app/src/main/assets/shaders/triangle.vert.spv \
            app/src/main/shaders/triangle.vert
          glslangValidator -V --target-env vulkan1.0 \
            -o app/src/main/assets/shaders/triangle.frag.spv \
            app/src/main/shaders/triangle.frag

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 67xFrames-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
